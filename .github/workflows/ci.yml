name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Los tests de integración del API levantan Postgres con Testcontainers (Docker del runner).
      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  migrations:
    name: Migraciones en seco
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sdl
          POSTGRES_PASSWORD: sdl
          POSTGRES_DB: sdl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sdl -d sdl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sdl:sdl@localhost:5432/sdl
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Consistencia de las migraciones
        run: pnpm db:check

      - name: El esquema y las migraciones están sincronizados
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            echo "::error::Hay cambios de esquema sin migración. Ejecuta 'pnpm db:generate' y súbela."
            git status --porcelain apps/api/drizzle
            exit 1
          fi

      - name: Aplicar migraciones sobre una BD vacía
        run: pnpm db:migrate

      - name: Volver a aplicarlas (deben ser idempotentes)
        run: pnpm db:migrate

      - name: Seed del contenido inicial
        run: pnpm db:seed

      - name: Volver a sembrar (debe ser idempotente)
        run: pnpm --filter @sdl/api db:seed

  docker:
    name: Imagen del API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Solo construye: que el Dockerfile no se rompa sin que nadie lo note (docs/deploy.md).
      - name: Construir apps/api/Dockerfile
        run: docker build -f apps/api/Dockerfile -t sdl-api:ci .

  e2e:
    name: Flujo completo en el navegador
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sdl
          POSTGRES_PASSWORD: sdl
          POSTGRES_DB: sdl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sdl -d sdl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_ADMIN_DATABASE_URL: postgres://sdl:sdl@localhost:5432/sdl
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Chromium para Playwright
        run: pnpm --filter @sdl/e2e exec playwright install --with-deps chromium

      # Invitar → unirse (política y mayoría de edad) → test de 20 → podio → historial.
      - run: pnpm e2e

      - name: Reporte si falla
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
