name: siempre-de-local

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: sdl
      POSTGRES_PASSWORD: sdl
      POSTGRES_DB: sdl
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ guarda los datos en /var/lib/postgresql/<versión>; se monta el padre.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sdl -d sdl']
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    image: caddy:2.11.7-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    extra_hosts:
      # Llega a Vite (:5173) y al API (:3000) que corren en el host.
      - 'host.docker.internal:host-gateway'

volumes:
  db-data:
  caddy-data:
