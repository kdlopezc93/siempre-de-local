packages:
  - apps/*
  - packages/*
  - e2e

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.12'
  - '@better-auth/drizzle-adapter@1.7.12'
  - '@better-auth/kysely-adapter@1.7.12'
  - '@better-auth/memory-adapter@1.7.12'
  - '@better-auth/mongo-adapter@1.7.12'
  - '@better-auth/prisma-adapter@1.7.12'
  - '@better-auth/telemetry@1.7.12'
  - better-auth@1.7.12

saveExact: true

# Scripts de instalación permitidos. Los nativos de Testcontainers (ssh2, cpu-features)
# son opcionales y no hacen falta.
allowBuilds:
  esbuild: true
  cpu-features: false
  ssh2: false
  protobufjs: false

# Auditoría de seguridad (2026-11-10, M3): fast-uri < 3.1.9 tiene vulnerabilidades conocidas
# (GHSA-333x-w4r6-6crp y otras); la trae Fastify por dentro (ajv). Quitar cuando Fastify la suba.
overrides:
  fast-uri: '^3.1.9'
