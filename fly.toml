# Staging del API en Fly.io (docs/deploy.md). Desde la raíz del repo: `fly deploy`.
# El nombre de la app se confirma al crearla (`fly apps create`).
app = "sdl-api-staging"
primary_region = "iad"

[build]
  dockerfile = "apps/api/Dockerfile"

[deploy]
  # Antes de pasar el tráfico a la versión nueva: migraciones y contenido (idempotentes).
  release_command = "sh -c 'node dist/scripts/migrate.js && node dist/scripts/seed.js'"
  # Sin corte al desplegar: prende la máquina nueva, espera su health check y recién ahí
  # apaga la vieja. Con una sola máquina, "rolling" deja el API caído uno o dos minutos.
  strategy = "bluegreen"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  BETTER_AUTH_URL = "https://api.siempredelocal.app"
  WEB_ORIGIN = "https://app.siempredelocal.app"
  COOKIE_DOMAIN = "siempredelocal.app"

[http_service]
  internal_port = 3000
  force_https = true
  # Staging: se apaga sin tráfico y despierta con la primera petición (cuesta centavos).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
